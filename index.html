<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Merry Christmas · 会发光的圣诞树</title>
    <meta
      name="description"
      content="一棵由粒子点亮的圣诞树。把照片挂上树梢，点击查看。拖拽旋转，滚轮缩放。"
    />
    <meta name="theme-color" content="#04060d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060812'/%3E%3Cpath d='M32 8l7 15h-4l6 13h-5l7 14H21l7-14h-5l6-13h-4z' fill='%2349e3a4'/%3E%3Crect x='29' y='49' width='6' height='7' rx='1' fill='%23c8a367'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="三维圣诞树场景"></canvas>

      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="hud">
        <p class="hud__greeting" id="greeting">Merry Christmas</p>
        <p class="hud__sub" id="sub">点击挂饰看大图 · 拖入照片挂上树</p>
      </header>

      <div class="toolbar">
        <button class="btn btn--add" id="add-photo" type="button">
          <span class="btn__plus" aria-hidden="true">+</span>
          <span>添加照片</span>
        </button>
        <input id="photo-input" type="file" accept="image/*" multiple hidden />
      </div>

      <div class="dropzone" id="dropzone" aria-hidden="true">
        <p>松开手，把照片挂上树</p>
      </div>

      <div class="viewer" id="viewer" hidden>
        <div class="viewer__backdrop" data-close></div>
        <figure class="viewer__card">
          <img class="viewer__image" id="viewer-image" alt="挂饰照片" />
          <figcaption class="viewer__actions">
            <button class="btn btn--quiet" id="viewer-delete" type="button">删除这张</button>
            <button class="btn" id="viewer-close" type="button">关闭</button>
          </figcaption>
        </figure>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="loader" id="loader">
        <div class="loader__ring" aria-hidden="true"></div>
        <p class="loader__text">正在点亮圣诞树</p>
      </div>

      <noscript>
        <p class="noscript">这个页面需要开启 JavaScript 才能看到圣诞树。</p>
      </noscript>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
